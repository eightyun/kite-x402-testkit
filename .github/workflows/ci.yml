name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build

  official:
    strategy:
      fail-fast: false
      matrix:
        gateway: [express, gin]
    uses: ./.github/workflows/simulation.yml
    with:
      gateway: ${{ matrix.gateway }}

  community:
    needs: official
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        gateway: [axum, hono]
    uses: ./.github/workflows/simulation.yml
    with:
      gateway: ${{ matrix.gateway }}
